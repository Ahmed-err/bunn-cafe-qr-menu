<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بُن وهيل — المنيو</title>
<meta name="description" content="منيو بُن وهيل: قهوة مختصة، لاتيه بالهيل، مشروبات باردة وحلو من مطبخنا. نموذج من أعمال سرمدكس.">
<meta name="theme-color" content="#F6EEE2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%233B2416'/%3E%3Cpath d='M28 40h40l-4 30a6 6 0 0 1-6 5H38a6 6 0 0 1-6-5Z' fill='%23F6EEE2'/%3E%3Cpath d='M68 46h4a7 7 0 0 1 0 14h-6' fill='none' stroke='%23F6EEE2' stroke-width='5'/%3E%3Cpath d='M34 54h28' stroke='%23D9822B' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brown: #3B2416;
    --roast: #6B3F22;
    --orange: #D9822B;
    --cream: #F6EEE2;
    --paper: #FBF6EE;
    --muted: rgba(59, 36, 22, .62);
    --line: rgba(59, 36, 22, .12);
    --font: 'Tajawal', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 70px; }
  body {
    margin: 0; background: var(--cream); color: var(--brown);
    background-image: radial-gradient(70% 40% at 15% 0%, rgba(217,130,43,.18), transparent 70%);
    font: 400 17px/1.6 var(--font); -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  svg.ic { display: block; }

  /* Header */
  header.wrap { padding-block: 22px 6px; position: relative; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { font: 800 34px/1 var(--font); margin: 0; letter-spacing: -.01em; }
  .brand span { color: var(--orange); }
  .lang { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 14px; cursor: pointer; }
  .hero { display: flex; align-items: flex-end; gap: 14px; margin-top: 22px; }
  .hero p { margin: 0; flex: 1; font: 700 28px/1.3 var(--font); }
  .hero p small { display: block; font: 400 15px/1.6 var(--font); color: var(--muted); margin-top: 8px; }
  .meta { margin: 14px 0 0; color: var(--muted); font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .meta .open::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4f9a5c; margin-inline-end: 6px; vertical-align: 1px; }
  .meta a { text-decoration: none; border-bottom: 1px dotted var(--muted); }

  .search { margin: 18px 0 0; position: relative; display: block; }
  .search input { width: 100%; padding: 12px 44px 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); color: var(--brown); font: inherit; font-size: 16px; }
  [dir=ltr] .search input { padding: 12px 14px 12px 44px; }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; top: 50%; inset-inline-start: 14px; transform: translateY(-50%); opacity: .55; }

  nav.cats { position: sticky; top: 0; z-index: 5; margin-top: 16px; background: rgba(246, 238, 226, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  nav.cats .row { display: flex; gap: 4px; overflow-x: auto; padding: 10px 16px; max-width: 560px; margin: 0 auto; scrollbar-width: none; }
  nav.cats .row::-webkit-scrollbar { display: none; }
  nav.cats a { flex: none; text-decoration: none; padding: 6px 14px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  nav.cats a.on { background: var(--brown); color: var(--cream); }

  /* Signature strip */
  .sig { margin: 24px 0 4px; }
  .sig h2 { font: 700 18px/1.3 var(--font); margin: 0 0 12px; }
  .strip { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 6px; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .card { flex: none; width: 148px; scroll-snap-align: start; text-decoration: none; }
  .card .art { height: 148px; border-radius: 18px; display: grid; place-items: center; }
  .card b { display: block; font-weight: 700; font-size: 16px; margin-top: 8px; line-height: 1.35; }
  .card span { color: var(--orange); font-size: 15px; font-weight: 700; }

  /* Sections */
  section.cat { padding: 34px 0 4px; }
  .cat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
  .ribbon {
    display: inline-block; margin: 0; padding: 10px 28px 12px;
    background: var(--brown); color: var(--cream); font: 800 23px/1 var(--font);
    clip-path: polygon(0% 12%, 4% 0%, 11% 8%, 19% 2%, 27% 9%, 36% 1%, 46% 7%, 55% 0%, 64% 8%, 73% 2%, 82% 9%, 90% 1%, 97% 7%, 100% 0%, 98% 50%, 100% 92%, 94% 100%, 86% 91%, 77% 99%, 68% 92%, 58% 100%, 49% 93%, 40% 100%, 31% 92%, 22% 99%, 13% 91%, 6% 100%, 0% 90%, 2% 50%);
  }
  .cat-head .ic { opacity: .9; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: baseline; gap: 10px; padding: 12px 0; }
  .item + .item { border-top: 1px solid var(--line); }
  .item .name { font-size: 18px; font-weight: 500; }
  .item .lead { flex: 1; border-bottom: 2px dotted rgba(217,130,43,.45); transform: translateY(-5px); min-width: 16px; }
  .item .price { font: 700 19px/1 var(--font); white-space: nowrap; }
  .item .price small { font-weight: 400; font-size: 13px; color: var(--muted); margin-inline-start: 3px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--orange); background: rgba(217,130,43,.14); padding: 1px 9px; border-radius: 999px; margin-inline-start: 8px; vertical-align: 2px; }
  .item.sold .name, .item.sold .price { opacity: .4; }
  .item.sold .price { text-decoration: line-through; }
  .item.sold .tag { color: var(--cream); background: var(--roast); }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }

  /* Loyalty card */
  .loyal { margin: 40px 0 0; background: var(--brown); color: var(--cream); border-radius: 22px; padding: 20px; }
  .loyal b { font: 800 20px/1.3 var(--font); display: block; }
  .loyal p { margin: 4px 0 14px; opacity: .75; font-size: 15px; }
  .stamps { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .stamps i { aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed rgba(246,238,226,.45); display: grid; place-items: center; }
  .stamps i.on { background: var(--orange); border: 0; }
  .stamps i:last-child { border-color: var(--orange); }

  footer.wrap { margin-top: 28px; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { padding: 13px 6px; border-radius: 14px; font-weight: 700; font-size: 15px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; }
  .actions button.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
  .addr { color: var(--muted); font-size: 14px; text-align: center; margin: 16px 0 0; }
  .made { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; font-size: 13px; color: var(--muted); }
  .made a { display: inline-block; margin-top: 8px; color: var(--brown); font-weight: 700; font-size: 15px; text-decoration: none; border-bottom: 2px solid var(--orange); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--brown); color: var(--cream); padding: 10px 18px; border-radius: 14px; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .toast { transition: none; } }
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <h1 class="brand" id="brand">بُن <span>وهيل</span></h1>
    <button class="lang" id="lang" type="button">English</button>
  </div>
  <div class="hero">
    <p id="hero">قهوة بتتحمص طازة كل أسبوع<small>اختار مشروبك، وقول للباريستا رقم الترابيزة.</small></p>
    <svg class="ic" width="92" height="106" viewBox="0 0 100 115" aria-hidden="true">
      <path d="M36 30c-8-10 8-16 0-26M50 34c-8-10 8-16 0-26M64 30c-8-10 8-16 0-26" fill="none" stroke="#3B2416" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="50" cy="108" rx="44" ry="6" fill="rgba(59,36,22,.15)"/>
      <path d="M14 44h66l-6 52a10 10 0 0 1-10 9H30a10 10 0 0 1-10-9L14 44Z" fill="#fff" stroke="#3B2416" stroke-width="2.5"/>
      <path d="M80 54h6a10 10 0 0 1 0 20h-8" fill="none" stroke="#3B2416" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="47" cy="44" rx="33" ry="5" fill="#6B3F22"/>
      <path d="M24 66h46" stroke="#D9822B" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="meta">
    <span class="open" id="open">مفتوح من ٨ الصبح لـ ٢ بالليل</span>
    <a id="loc" href="#" target="_blank" rel="noopener">الزمالك، القاهرة</a>
  </div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="دوّر على مشروب…" autocomplete="off">
  </label>
</header>

<nav class="cats" aria-label="الأقسام"><div class="row" id="nav"></div></nav>

<main class="wrap">
  <div class="sig" id="sig">
    <h2 id="sigTitle">من توقيع بُن وهيل</h2>
    <div class="strip" id="strip"></div>
  </div>
  <div id="menu"></div>

  <div class="loyal">
    <b id="loyalT">كارت الولاء</b>
    <p id="loyalP">كل ١٠ أكواب، الحادي عشر علينا. اطلب الكارت من الكاشير.</p>
    <div class="stamps" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i></div>
  </div>
</main>

<footer class="wrap">
  <div class="actions" style="margin-top:22px">
    <button class="primary demo" id="wa" type="button">واتساب</button>
    <button class="demo" id="dir" type="button">الاتجاهات</button>
  </div>
  <p class="addr" id="addr"></p>
  <div class="made">
    <span id="fake">علامة افتراضية، صُمّمت كنموذج لعرض أعمالنا.</span><br>
    <a id="cta" href="https://wa.me/201094985025?text=%D8%B9%D8%A7%D9%8A%D8%B2%20%D9%85%D9%86%D9%8A%D9%88%20QR%20%D8%B2%D9%8A%20%D8%A8%D9%8F%D9%86%20%D9%88%D9%87%D9%8A%D9%84%20%D9%84%D9%84%D9%83%D8%A7%D9%81%D9%8A%D9%87%20%D8%A8%D8%AA%D8%A7%D8%B9%D9%8A" target="_blank" rel="noopener">عايز منيو زي ده لكافيهك؟ كلّم سرمدكس</a>
  </div>
</footer>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>
  const D = window.MENU;
  const ICONS = {
    cup: '<path d="M10 22h36l-3 24a6 6 0 0 1-6 5H19a6 6 0 0 1-6-5Z" fill="#fff" stroke="#3B2416" stroke-width="2.5"/><path d="M46 27h3a6 6 0 0 1 0 12h-5" fill="none" stroke="#3B2416" stroke-width="3.5" stroke-linecap="round"/><path d="M17 33h22" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/><path d="M22 16c-4-5 4-8 0-13M32 16c-4-5 4-8 0-13" fill="none" stroke="#3B2416" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/>',
    drip: '<path d="M14 10h32l-11 16h-10Z" fill="#fff" stroke="#3B2416" stroke-width="2.5" stroke-linejoin="round"/><path d="M30 30v5" stroke="#6B3F22" stroke-width="3" stroke-linecap="round"/><path d="M18 38h24v10a6 6 0 0 1-6 6H24a6 6 0 0 1-6-6Z" fill="#fff" stroke="#3B2416" stroke-width="2.5"/><path d="M20 45h20" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/>',
    glass: '<path d="M16 8h28l-4 44a5 5 0 0 1-5 4H25a5 5 0 0 1-5-4Z" fill="#fff" stroke="#3B2416" stroke-width="2.5"/><path d="M19 30h22l-2 22H21Z" fill="#6B3F22" opacity=".85"/><rect x="23" y="20" width="8" height="8" rx="2" fill="none" stroke="#3B2416" stroke-width="2"/><rect x="31" y="24" width="7" height="7" rx="2" fill="none" stroke="#3B2416" stroke-width="2"/><path d="M36 2l-4 22" stroke="#D9822B" stroke-width="3.5" stroke-linecap="round"/>',
    citrus: '<circle cx="30" cy="32" r="20" fill="#fff" stroke="#3B2416" stroke-width="2.5"/><circle cx="30" cy="32" r="14" fill="#F4C27A" stroke="#D9822B" stroke-width="2"/><path d="M30 18v28M16 32h28M20 22l20 20M40 22 20 42" stroke="#fff" stroke-width="2"/><path d="M30 12c4-6 10-8 16-6-2 6-8 9-16 6Z" fill="#7a9a5c"/>',
    leaf: '<path d="M14 46C10 24 26 8 50 8c2 24-14 40-36 38Z" fill="#fff" stroke="#3B2416" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 46C24 32 34 22 46 12" fill="none" stroke="#D9822B" stroke-width="3" stroke-linecap="round"/><path d="M26 34l-1-9M33 27l-1-8M24 36l10 1" stroke="#3B2416" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>',
    cake: '<path d="M8 30l40-14v26H8Z" fill="#fff" stroke="#3B2416" stroke-width="2.5" stroke-linejoin="round"/><path d="M8 30h40" stroke="#3B2416" stroke-width="2.5"/><path d="M8 36h40" stroke="#D9822B" stroke-width="4"/><path d="M8 42h40v8H8Z" fill="#6B3F22"/><circle cx="40" cy="12" r="5" fill="#D9822B"/>',
  };
  const icon = (k, s) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 60 60" aria-hidden="true">${ICONS[k]}</svg>`;
  const T = {
    ar: { lang: 'English', hero: 'قهوة بتتحمص طازة كل أسبوع<small>اختار مشروبك، وقول للباريستا رقم الترابيزة.</small>',
          open: 'مفتوح من ٨ الصبح لـ ٢ بالليل', loc: 'الزمالك، القاهرة', q: 'دوّر على مشروب…', sig: 'من توقيع بُن وهيل',
          sold: 'خلصت', cur: 'ج.م', none: 'مفيش نتايج لـ', wa: 'واتساب', dir: 'الاتجاهات', nav: 'الأقسام',
          loyalT: 'كارت الولاء', loyalP: 'كل ١٠ أكواب، الحادي عشر علينا. اطلب الكارت من الكاشير.',
          fake: 'علامة افتراضية، صُمّمت كنموذج لعرض أعمالنا.', cta: 'عايز منيو زي ده لكافيهك؟ كلّم سرمدكس',
          demo: 'ده نموذج عرض، الزرار ده بيوصل لرقم الكافيه في النسخة الحقيقية', title: 'بُن وهيل — المنيو' },
    en: { lang: 'العربية', hero: 'Coffee roasted fresh every week<small>Pick your drink and tell the barista your table number.</small>',
          open: 'Open 8 am – 2 am', loc: 'Zamalek, Cairo', q: 'Search the menu…', sig: 'Bunn & Hail signatures',
          sold: 'Sold out', cur: 'EGP', none: 'Nothing matches', wa: 'WhatsApp', dir: 'Directions', nav: 'Categories',
          loyalT: 'Loyalty card', loyalP: 'Every 11th cup is on us. Ask the cashier for a card.',
          fake: 'A fictional brand, designed as a Sarmadax portfolio sample.', cta: 'Want a menu like this for your café? Talk to Sarmadax',
          demo: 'This is a demo. In a real menu this button reaches the café.', title: 'Bunn & Hail — Menu' },
  };
  let lang = 'ar';
  try { lang = localStorage.getItem('bunn-lang') || 'ar'; } catch (e) {}

  const byId = Object.fromEntries(D.categories.flatMap(c => c.items.map(i => [i.id, { ...i, cat: c.id }])));
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const num = n => lang === 'ar' ? Number(n).toLocaleString('ar-EG') : n;
  const $ = id => document.getElementById(id);

  function itemRow(i) {
    const t = T[lang];
    const tag = i.soldOut ? t.sold : (lang === 'ar' ? i.tagAr : i.tagEn);
    return `<li class="item${i.soldOut ? ' sold' : ''}">
      <span class="name">${esc(i[lang])}${tag ? `<span class="tag">${esc(tag)}</span>` : ''}</span>
      <span class="lead"></span>
      <span class="price">${num(i.price)}<small>${t.cur}</small></span>
    </li>`;
  }

  function render() {
    const t = T[lang];
    const q = $('q').value.trim().toLowerCase();
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t.title;
    $('brand').innerHTML = lang === 'ar' ? 'بُن <span>وهيل</span>' : 'Bunn <span>&amp; Hail</span>';
    for (const k of ['lang', 'open', 'loc', 'wa', 'dir', 'loyalT', 'loyalP', 'fake', 'cta']) $(k).textContent = t[k];
    $('hero').innerHTML = t.hero;
    $('sigTitle').textContent = t.sig;
    $('q').placeholder = t.q;
    $('addr').textContent = D.address[lang];
    document.querySelector('nav.cats').setAttribute('aria-label', t.nav);

    const cats = D.categories
      .map(c => ({ ...c, shown: q ? c.items.filter(i => (i.ar + ' ' + i.en + ' ' + c.ar + ' ' + c.en).toLowerCase().includes(q)) : c.items }))
      .filter(c => c.shown.length);

    $('nav').innerHTML = cats.map(c => `<a href="#${c.id}" data-id="${c.id}">${esc(c[lang])}</a>`).join('');
    $('sig').hidden = !!q;
    $('strip').innerHTML = D.featured.map(([id, ar, en, tone, ic]) => ({ i: byId[id], ar, en, tone, ic }))
      .filter(f => f.i && !f.i.soldOut)
      .map(f => `<a class="card" href="#${f.i.cat}">
        <div class="art" style="background:${f.tone}">${icon(f.ic, 84)}</div>
        <b>${esc(lang === 'ar' ? f.ar : f.en)}</b><span>${num(f.i.price)} ${t.cur}</span>
      </a>`).join('');
    $('menu').innerHTML = cats.length ? cats.map(c => `
      <section class="cat" id="${c.id}">
        <div class="cat-head"><h2 class="ribbon">${esc(c[lang])}</h2>${icon(c.icon, 52)}</div>
        <ul class="items">${c.shown.map(itemRow).join('')}</ul>
      </section>`).join('') : `<p class="empty">${t.none} “${esc(q)}”</p>`;
    spy();
  }

  // Highlight the category currently on screen
  let observer;
  function spy() {
    observer?.disconnect();
    const links = [...document.querySelectorAll('nav.cats a')];
    observer = new IntersectionObserver(entries => {
      for (const e of entries) if (e.isIntersecting) {
        links.forEach(a => a.classList.toggle('on', a.dataset.id === e.target.id));
        const a = document.querySelector(`nav.cats a[data-id="${e.target.id}"]`), row = $('nav');
        if (a) { const ar = a.getBoundingClientRect(), rr = row.getBoundingClientRect(); row.scrollBy({ left: ar.left + ar.width / 2 - (rr.left + rr.width / 2), behavior: 'smooth' }); }
      }
    }, { rootMargin: '-80px 0px -70% 0px' });
    document.querySelectorAll('section.cat').forEach(s => observer.observe(s));
  }

  let toastTimer;
  document.querySelectorAll('.demo').forEach(b => b.onclick = () => {
    const el = $('toast'); el.textContent = T[lang].demo; el.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
  });
  $('lang').onclick = () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('bunn-lang', lang); } catch (e) {}
    render();
  };
  $('q').oninput = render;
  $('loc').href = D.maps;
  render();
</script>
</body>
</html>
